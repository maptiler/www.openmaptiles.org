# Overlay for the labs.maptiler.com staging deployment. Layer it on top of the main
# config — Jekyll merges later files over earlier ones:
#
#   bundle exec jekyll build --config _config.yml,_config.staging.yml
#
# Production never reads this file.
#
# Why it is needed: maptiler/www.openmaptiles.org publishes to
# labs.maptiler.com/www.openmaptiles.org/ — an org-domain project page, i.e. a
# non-root path. With `baseurl: ""` every absolute asset and link path resolves
# against labs.maptiler.com/ and 404s.
url: https://labs.maptiler.com
baseurl: /www.openmaptiles.org

# Read by robots.txt and _includes/seo.html to keep the staging copy out of search
# results. Without it labs.maptiler.com serves a full duplicate of openmaptiles.org
# and competes with it for the same queries.
staging: true

# NOTE: sitemap.xml cannot be suppressed from here. `staging: true` stops robots.txt
# advertising one, but jekyll-sitemap still generated the file — 107 labs.maptiler.com
# URLs enumerating the whole duplicate site, fetchable by anything that skips robots.txt.
#
# Overriding `plugins:` does NOT drop it: the gem lives in the Gemfile's :jekyll_plugins
# group, which Bundler auto-requires regardless of what this config lists. The staging
# workflows delete _site/sitemap.xml after the build instead, the same way they delete
# CNAME, and script/verify-build with EXPECT_SITEMAP=0 asserts it is really gone.

# NOTE: CNAME is deliberately NOT excluded here. Jekyll replaces arrays across
# merged configs rather than appending, so redeclaring `exclude` would silently drop
# every entry in _config.yml's list. The staging workflow deletes _site/CNAME after
# the build instead, and script/verify-build with REQUIRE_CNAME=0 asserts it is gone.
